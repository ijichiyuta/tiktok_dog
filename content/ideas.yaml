# ネタ帳。plan コマンドがシリーズ・曜日・季節に合わせて上から順に使う（used は自動で付く）。
# dog_age: puppy / adult / senior   household: solo / partner / family / parents
# persona: 一番刺さる相手（config/personas.yaml の id）   review: true なら人の目で必ず確認
# months: そのネタが使える月（E は必須。季節の出てくる他のネタにも付ける）

# ---- A. きみからのお願い（十戒のテーマ × オリジナルの日常。犬が語る）----
- id: A01
  series: A
  title: ぼくの一生は、あなたの少しだけ
  scene: いつもの散歩道の並木。季節がひとめぐりするたびに、ぼくはあなたより早く年をとる、と犬が語る。季節の具体物は投稿月に合わせる
  dog_age: adult
  household: solo
  persona: 8
- id: A02
  series: A
  title: わからなくて、ごめんね
  scene: お迎え初日。トイレを失敗して震える子犬が「まだ、ここのことがわからないだけなんだ」と語る
  dog_age: puppy
  household: solo
  persona: 8
- id: A03
  series: A
  title: 待つのは、とくいだよ
  scene: 初めての留守番。玄関マットの上で待ち続ける犬が、ドアの向こうの足音を数える
  dog_age: puppy
  household: solo
  persona: 1
- id: A04
  series: A
  title: 長く、怒らないで
  scene: いたずらを叱られた夜。部屋のすみで背中を向けていた犬が、本当は謝るタイミングを待っていた
  dog_age: adult
  household: solo
  persona: 3
- id: A05
  series: A
  title: ぼくに、話しかけて
  scene: 仕事で落ち込んだ夜、ソファで独り言のように愚痴をこぼす飼い主。言葉はわからないけど、声が好きだと犬が語る
  dog_age: adult
  household: solo
  persona: 2
- id: A06
  series: A
  title: 前のおうちのこと
  scene: 保護犬として来た子が、初めてしっぽを振った日。「やさしくされたことは、ちゃんと覚えている」
  dog_age: adult
  household: partner
  persona: 9
  note: 前の飼い主を悪く描かない。過去は語らず「今」だけを語る
- id: A07
  series: A
  title: がまんしてるんじゃないよ
  scene: 小さな子どもに耳を引っ張られても、じっとしている犬。「この子は、あなたの大切な子だから」
  dog_age: adult
  household: family
  persona: 3
- id: A08
  series: A
  title: ごはんを残した日は
  scene: いつもはすぐ食べるごはんを残した日。犬は「言葉で言えないから、こうやって伝えるしかないんだ」と語る。飼い主が気づいて、そっと様子を見る
  dog_age: adult
  household: solo
  persona: 1
  review: true
  note: 病気・病名・病院を書かない。「気づいてくれてありがとう」で終える
- id: A09
  series: A
  title: 階段、のぼれなくなっても
  scene: 階段の下で見上げるシニア犬を、飼い主が抱っこして一緒にのぼる。「重くなったでしょ。ありがとう」
  dog_age: senior
  household: solo
  persona: 4
- id: A10
  series: A
  title: そばにいてね
  scene: 年をとった犬が、日だまりで飼い主の手に顎をのせる。「どんな日も、あなたの手のにおいがすれば大丈夫」
  dog_age: senior
  household: solo
  persona: 7
  review: true
  note: 最期は描かない。「あなたの家の子で、しあわせでした」の方向。病院・待合室は出さない

# ---- B. ふつうの一日（飼い主の独白）----
- id: B01
  series: B
  title: 雨の日の散歩
  scene: 雨で散歩をサボった夜、リードをくわえて玄関で待つ犬。傘をさして外に出る（設計書のサンプル脚本）
  dog_age: adult
  household: solo
  persona: 2
- id: B02
  series: B
  title: 床で寝た夜
  scene: 飲み会帰りに床で寝落ち。夜中に目覚めると、犬が自分のベッドでなく隣の床で寝ていた
  dog_age: adult
  household: solo
  persona: 2
  note: ⚠ 参考アカウント（ワン寿）の投稿とほぼ同じ筋。そのまま使うと型のコピーになるので、使うなら場面を大きく変える（2026-09-27 保留）
- id: B03
  series: B
  title: 玄関の、あの顔
  scene: 残業で遅くなった日。ドアを開けた瞬間の全身での喜び。待たせてばかりの罪悪感と、それを帳消しにする顔
  dog_age: adult
  household: solo
  persona: 1
- id: B04
  series: B
  title: 在宅ワークの視線
  scene: 在宅勤務中、ずっと足元から見上げる視線。会議が終わって一緒に窓辺でひと休み
  dog_age: adult
  household: solo
  persona: 1
- id: B05
  series: B
  title: 泣いた夜
  scene: 理由を言えない涙の夜、何も聞かずに顔を舐めにくる。膝の上に乗って動かない
  dog_age: adult
  household: solo
  persona: 1
- id: B06
  series: B
  title: 風邪をひいた日
  scene: 飼い主が熱で寝込んだ日、布団の横から一歩も離れない犬。散歩に行けない一日
  dog_age: adult
  household: solo
  persona: 2
- id: B07
  series: B
  title: お風呂のあと
  scene: シャンプーが嫌いで逃げ回ったあと、ドライヤーで乾かしながら、ふわふわになった体を抱く
  dog_age: adult
  household: solo
  persona: 1
- id: B08
  series: B
  title: 朝の5分
  scene: 目覚ましより先に起こしにくる犬。二度寝したいのに、しっぽの音で起きる。ふたりの朝ごはん
  dog_age: adult
  household: solo
  persona: 10
- id: B09
  series: B
  title: いつもの散歩道
  scene: 毎日同じ道なのに、毎日はじめてみたいに嗅ぎまわる犬。自分が見落としていた季節に気づく
  dog_age: adult
  household: solo
  persona: 10
- id: B10
  series: B
  title: 引っ越しの夜
  scene: 段ボールだらけの新しい部屋。落ち着かない犬が、自分の古いブランケットの上でだけ眠る
  dog_age: adult
  household: partner
  persona: 8
- id: B11
  series: B
  title: ソファの半分
  scene: 一人暮らしのソファ、いつの間にか半分は犬の場所。狭いのに、そこに座る
  dog_age: adult
  household: solo
  persona: 2
- id: B12
  series: B
  title: 休日の寝坊
  scene: 休日に昼まで寝ていたら、犬がずっと布団の足元で待っていた。起きた瞬間のしっぽ
  dog_age: adult
  household: solo
  persona: 2
- id: B13
  series: B
  title: スマホばかりの夜
  scene: スマホを見ている間、そばでおもちゃをくわえて座っていた犬。画面を伏せて一緒に遊ぶ
  dog_age: adult
  household: solo
  persona: 2
- id: B14
  series: B
  title: 久しぶりの帰省
  scene: この子を連れて実家に帰る。親の膝の上でくつろぐ犬と、年をとった親の背中
  dog_age: adult
  household: parents
  persona: 5
- id: B15
  series: B
  title: ふたりになった日
  scene: パートナーと暮らし始めた日。犬が新しい人の靴のにおいをずっと嗅いで、夜にはその足元で寝ていた
  dog_age: adult
  household: partner
  persona: 8
- id: B16
  series: B
  title: 赤ちゃんが来た日
  scene: 家族に赤ちゃんが来た日。距離をとって見守る犬。夜中の授乳のとき、そっと隣で起きている
  dog_age: adult
  household: family
  persona: 3
- id: B17
  series: B
  title: 帰る日の朝
  scene: 出張で家を空ける朝、スーツケースの上に座り込む犬。帰ってきた夜、変わらない「おかえり」の顔
  dog_age: adult
  household: solo
  persona: 6
- id: B18
  series: B
  title: 爪切りのあと
  scene: 爪切りを嫌がって拗ねた犬。おやつで仲直りして、手のひらに顎をのせてくる
  dog_age: adult
  household: solo
  persona: 1
- id: B19
  series: B
  title: 夜の見回り
  scene: 寝る前に家じゅうを歩いて回る犬。最後に必ず飼い主の布団に戻ってくる。守られていたのは私のほう
  dog_age: adult
  household: solo
  persona: 10
- id: B20
  series: B
  title: 窓辺の留守番
  scene: 見守りカメラに映った昼間の犬。ずっと窓辺で外を見ている。帰り道、少しだけ早足になる
  dog_age: adult
  household: solo
  persona: 1
- id: B21
  series: B
  title: 疲れた帰り道のコンビニ
  scene: くたくたの帰り道、自分の夕飯より先に、この子の好きなおやつを買っていた
  dog_age: adult
  household: solo
  persona: 2
- id: B22
  series: B
  title: ボール遊び
  scene: 何回投げても持って帰ってくる。疲れたと言っても、目がもう一回と言っている。今日は、とことん付き合う
  dog_age: adult
  household: solo
  persona: 2
- id: B23
  series: B
  title: 写真フォルダ
  scene: スマホの写真フォルダを遡ると、ほとんどがこの子。自分が写っている写真は一枚もない
  dog_age: adult
  household: solo
  persona: 5
- id: B24
  series: B
  title: 寝言
  scene: 眠りながら足を動かし、小さく鳴く犬。夢の中でも走っているのは、きっといつもの散歩道
  dog_age: adult
  household: solo
  persona: 1

# ---- C. きみとの時間（子犬〜シニアのどこか1時点。回ごとに独立）----
- id: C01
  series: C
  title: はじめての夜
  scene: お迎えの夜。ケージの中で鳴き続ける子犬。手をそっと入れると、指をくわえて眠った
  dog_age: puppy
  household: solo
  persona: 8
- id: C02
  series: C
  title: はじめてのトリミング
  scene: 初めてトリミングに預けた日。迎えに行くと、ガラス越しにこちらを見つけて跳ねる
  dog_age: puppy
  household: solo
  persona: 1
- id: C03
  series: C
  title: 名前を覚えた日
  scene: 何度呼んでも来なかった子犬が、ある日、呼ぶと転がるように走ってきた
  dog_age: puppy
  household: solo
  persona: 8
- id: C04
  series: C
  title: はじめての雪
  scene: 生まれて初めての雪に、前足を上げて固まる子犬。気づけば雪まみれで走り回る
  dog_age: puppy
  household: solo
  persona: 5
  months: [12, 1, 2]
- id: C05
  series: C
  title: 白いひげ
  scene: ふと見ると、口のまわりに白い毛が増えていた。子犬の頃の写真と、今の寝顔を並べる
  dog_age: senior
  household: solo
  persona: 4
- id: C06
  series: C
  title: ゆっくり歩く散歩
  scene: 昔は引っぱられていた散歩道を、今は私が歩幅を合わせて歩く。立ち止まる回数が増えた
  dog_age: senior
  household: solo
  persona: 4
- id: C07
  series: C
  title: 実家の玄関
  scene: 年に二度の帰省。昔のように走ってはこないけれど、しっぽだけは大きく振っている
  dog_age: senior
  household: parents
  persona: 5
- id: C08
  series: C
  title: 何度目かの誕生日
  scene: 小さなケーキ代わりのささみ。毎年同じ写真の構図で、少しずつ顔つきが変わっている
  dog_age: senior
  household: partner
  persona: 4
- id: C09
  series: C
  title: 届かなくなったソファ
  scene: ジャンプで乗れていたソファに、前足をかけて見上げるようになった。小さなステップを置いた日
  dog_age: senior
  household: solo
  persona: 10
- id: C10
  series: C
  title: 毎朝の「ひとりじゃないよ」
  scene: 一人暮らしの朝。カーテンを開けると、足元でのびをする犬。この子がいるから、ちゃんと朝を始められる
  dog_age: senior
  household: solo
  persona: 10

