# 新しい動画はこの YAML をコピーして台本を書くだけ。
#   python -m reelfx sheet  projects/template/script.yaml -o out/check.jpg      # 見た目チェック
#   python -m reelfx render projects/template/script.yaml -o out/fx.mp4 --alpha out/fx.mov
#   python -m reelfx render projects/template/script.yaml -o out/final.mp4 --footage talk.mp4 --audio talk.mp4
#
# 強調記法: {文字|サイズ倍率|スタイル}  例 "{結論|1.2|gold_gothic}です"
# スタイル: white_gothic / gold_gothic / gold_mincho / silver_gothic / silver_mincho / crimson_gothic / purple_gothic / brush_red
duration: 16
background: neon
cues:
  - t: [0.0, 2.45]
    do: opening
    bg_text: "いき\nなり"
    lines:
      - [0.1, "今日", gold_mincho, 271, 885]
      - [0.9, "{バズる|1}{の法則|0.4}", gold_mincho, 200, 1150]
      - [1.4, "教えます", silver_mincho, 140, 1340]
  - {t: [2.5, 3.6], do: caption, text: "まず結論から言うと"}
  - {t: [3.6, 5.2], do: caption, text: "{毎日投稿|1|gold_gothic}より\n大事なことがある", y: 980}
  - t: [5.2, 8.0]
    do: stack
    items:
      - [5.2, "#ハッシュタグ", purple]
      - [6.0, "投稿時間", magenta]
      - [6.8, "サムネの\nデザイン", olive_gold]
  - {t: [8.0, 9.2], do: warning, text: "ここからが\n{重要|1.35}"}
  - {t: [9.2, 10.8], do: number_hero, num: "1", text: "つのテーマ"}
  - {t: [10.8, 12.4], do: quote, text: "伸びなくても\nジャンルは変えるな"}
  - {t: 12.4, do: transition, kind: smear}
  - {t: [12.6, 14.0], do: doom, text: "変えたら\n終わります"}
  - {t: [14.0, 16.0], do: cta_follow, text: "フォローして\nおいてください"}
