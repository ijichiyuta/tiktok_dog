# シリーズ定義と週のローテーション。
# 設計書の頻度（A1+B3+C1+D1+E月1〜2）は週5〜6本で毎日にならない（decisions.md #7）→ 土曜は E が無ければ B で埋める。
series:
  A:
    name: きみからのお願い
    tag: きみからのお願い
    narrator: dog          # 犬が飼い主に語りかける（十戒の形式）
    voice: 一人称は「ぼく」、飼い主は「あなた」。やわらかい敬体と常体のまじった、手紙のような語り。
    note: 十戒のテーマだけ借りる。原文は転載しない。十戒の番号や「十戒」という語は本文に出さない。
  B:
    name: ふつうの一日
    tag: ふつうの一日
    narrator: owner
    voice: 一人称は「私」、犬は「この子」。飼い主の独白。常体。
  C:
    name: きみとの時間
    tag: きみとの時間
    narrator: owner
    voice: 一人称は「私」、犬は「この子」。子犬〜シニアのどこか1時点を切り取る。回ごとに独立して読めること（厳密な時系列にしない）。
  D:
    name: みんなの子の話
    tag: みんなの子の話
    narrator: owner
    voice: 一人称は「私」、犬は「この子」。フォロワーから預かった実話を、特定できない形に直して絵本にする。犬種は主役犬に置き換えず、応募者の子の犬種で描く（画像は参照なし）。
    enabled_from_followers: 1000
  E:
    name: 季節の絵本
    tag: 季節の絵本
    narrator: owner
    voice: 一人称は「私」、犬は「この子」。季節の行事や天気を入口にする。

# 曜日ごとの枠（0=月）。value はシリーズの優先順。先頭のシリーズにネタが無ければ次へ。
weekly:
  0: [B]
  1: [A, B]
  2: [B]
  3: [C, B]
  4: [B]
  5: [E, B]
  6: [D, C, B]
