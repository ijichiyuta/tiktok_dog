# 台本の機械チェック（src/ehon/validate.py）。decisions.md の解消方針をここで数値にする。
slides: 20
max_chars: 30            # 1枚の本文（空白・改行を除く）
max_lines: 2             # 実際にレイアウトしたときの行数
emphasis_slides: [18, 19]   # 赤文字はこのどちらか1枚だけ
farewell_slides: [16, 17]   # 別れ・寿命の語はここにだけ置ける
max_farewell: 1             # 別れの語（下記）が出てよい枚数
max_reuse: 0                # 使い回しは禁止（2026-09-27 本人: 同じ絵が続くと手抜きに見える）
hashtags: [4, 6]

# 別れを直接指す語。1投稿1枚まで、16〜17枚目のみ
farewell_words: [いつか, 虹の橋, 別れ, 最期, 天国, 旅立, お空, さよなら, いなくなる, いなくなった]

# 使ってはいけない語（死・病気の直接描写、ペットロス層を傷つける表現）
banned_words:
  - 死
  - 亡くな
  - 病気
  - 病院
  - 余命
  - 安楽死
  - 看取
  - 葬
  - 火葬
  - 遺骨
  - 癌            # ひらがなの「がん」は「しゃがんで」等に誤反応するので漢字とカタカナで見る
  - ガン
  - 腫瘍
  - 手術
  - 点滴
  - 介護
  - あなたのせい
  - 私のせい
  - かわいそう
  - 手遅れ
  - 後悔しても
  - 気づいてあげられなかった
  - もっと早く

# 20枚目は問いかけか行動提案で終わる
last_slide_patterns: ["？", "?", "ぎゅっと", "なでて", "撫でて", "抱きしめて", "呼んで", "教えて", "ください"]

# 人の目で必ず確認する回（decisions.md #9）
always_review_themes: [食欲, ごはんを残, 動物病院, 待合室, 体調]

# 1枚目は絵本の表紙。フックの文（理由・なぜ・時刻など）＋犬を必ず描く（2026-09-27 本人指示）
cover_dog: true
cover_hook_words: [理由, なぜ, 時, 夜, 朝, 日]
